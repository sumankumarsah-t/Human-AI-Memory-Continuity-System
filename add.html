<!DOCTYPE html>
<html>
<head>
    <title>Add Decision</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h2>Add a Decision</h2>

    <form method="POST">
        <label>Goal:</label><br>
        <input type="text" name="goal" required><br><br>

        <label>Constraints:</label><br>
        <textarea name="constraints" rows="3"></textarea><br><br>

        <label>Options (comma separated):</label><br>
        <input type="text" name="options" required><br><br>

        <label>Chosen Option:</label><br>
        <input type="text" name="chosen_option" required><br><br>

        <label>Confidence (0–1):</label><br>
        <input type="number" name="confidence" min="0" max="1" step="0.1" required><br><br>

        <label>Reasoning:</label><br>
        <textarea name="reasoning" rows="4" required></textarea><br><br>

        <button type="submit">Save Decision</button>
    </form>

    <p><a href="/">Back to Home</a></p>
</body>
</html>
